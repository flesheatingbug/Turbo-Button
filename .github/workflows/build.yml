name: Build Turbo Button

on:
  push:
  workflow_dispatch:

jobs:
  windows-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test and cross-compile
        working-directory: agent
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../TurboButton.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: TurboButton-windows
          path: TurboButton.exe

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Use stable signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.TURBO_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.TURBO_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/turbobutton.jks"
            echo "TURBO_KEYSTORE=$RUNNER_TEMP/turbobutton.jks" >> "$GITHUB_ENV"
            echo "TURBO_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets set - APK is signed with a throwaway debug key, so each build must be uninstalled before installing the next."
          fi
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TurboButton.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TurboButton-android
          path: TurboButton.apk

  publish:
    needs: [windows-agent, android-app]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest -R "$REPO" --yes --cleanup-tag || true
          gh release create latest out/TurboButton.exe out/TurboButton.apk -R "$REPO" --prerelease \
            --target "$GITHUB_SHA" --title "Latest build $(date -u '+%Y-%m-%d %H:%M') UTC" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Install TurboButton.apk on your phone; copy TurboButton.exe to a USB stick."
