name: Build Turbo Button

on:
  push:
  workflow_dispatch:

jobs:
  windows-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Embed icon, admin manifest and version info
        working-directory: agent
        run: |
          go install github.com/tc-hib/go-winres@latest
          "$(go env GOPATH)/bin/go-winres" make --in winres/winres.json --arch amd64
          ls -la *.syso
      - name: Test and cross-compile
        working-directory: agent
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../TurboButton.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: TurboButton-windows
          path: TurboButton.exe

  linux-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build static binaries
        working-directory: agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../TurboButton-linux-x86_64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../TurboButton-linux-arm64 .
          file ../TurboButton-linux-*
      - name: Smoke test the real Linux scan
        run: |
          sudo TURBO_RESUME_DIR=/tmp/tbci ./TurboButton-linux-x86_64 --no-screen > agent.log 2>&1 &
          sleep 3
          TOK=$(grep -o '#t=[0-9a-f]*' agent.log | head -1 | cut -c4-)
          curl -sf -H "X-Token: $TOK" http://127.0.0.1:47800/api/info | grep -q '"os":"linux"'
          curl -sf -H "X-Token: $TOK" -X POST http://127.0.0.1:47800/api/scan > /dev/null
          for i in $(seq 1 60); do sleep 2; curl -sf -H "X-Token: $TOK" http://127.0.0.1:47800/api/scan | grep -q '"latest":{' && break; done
          curl -sf -H "X-Token: $TOK" http://127.0.0.1:47800/api/scan | python3 -c "import sys,json; d=json.load(sys.stdin)['latest']; print(d['system']['os'], '| sections:', len(d), '| errors:', d['errors']); assert d['system'] and d['volumes']"
          curl -sf -H "X-Token: $TOK" -X POST http://127.0.0.1:47800/api/finish || true
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp TurboButton-linux-x86_64 AppDir/usr/bin/turbobutton
          cp packaging/linux/AppRun AppDir/AppRun && chmod +x AppDir/AppRun
          cp packaging/linux/turbobutton.desktop AppDir/
          cp agent/winres/icon.png AppDir/turbobutton.png && cp AppDir/turbobutton.png AppDir/.DirIcon
          curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream AppDir TurboButton-x86_64.AppImage
          ls -la TurboButton-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: TurboButton-linux
          path: |
            TurboButton-x86_64.AppImage
            TurboButton-linux-x86_64
            TurboButton-linux-arm64

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unlock the signing key
        env:
          KEYSTORE_PASS: ${{ secrets.TURBO_KEYSTORE_PASS }}
        shell: bash
        run: |
          # The key is stored encrypted in the repo (android/app/turbobutton.keystore.enc).
          # Its passphrase is the repository secret TURBO_KEYSTORE_PASS. With the same key on every
          # build, new APKs install over the old one, so the in-app updater works.
          KEYSTORE_PASS="$(printf '%s' "$KEYSTORE_PASS" | tr -d '[:space:]')"   # ignore stray spaces/line breaks from pasting
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::warning::Secret TURBO_KEYSTORE_PASS is not set - the APK is signed with a throwaway key, so in-app updates can't install it over the old one."
          elif openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:KEYSTORE_PASS \
                 -in android/app/turbobutton.keystore.enc -out "$RUNNER_TEMP/turbobutton.jks" 2>/dev/null; then
            echo "Signing key unlocked."
            echo "TURBO_KEYSTORE=$RUNNER_TEMP/turbobutton.jks" >> "$GITHUB_ENV"
            echo "TURBO_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            echo "::error::TURBO_KEYSTORE_PASS doesn't unlock android/app/turbobutton.keystore.enc (wrong passphrase). This APK is signed with a throwaway key; fix the secret and push again."
          fi
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TurboButton.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TurboButton-android
          path: TurboButton.apk

  publish:
    needs: [windows-agent, linux-agent, android-app]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest -R "$REPO" --yes --cleanup-tag || true
          gh release create latest out/TurboButton.exe out/TurboButton-x86_64.AppImage out/TurboButton-linux-x86_64 out/TurboButton-linux-arm64 out/TurboButton.apk -R "$REPO" --prerelease \
            --target "$GITHUB_SHA" --title "Latest build $(date -u '+%Y-%m-%d %H:%M') UTC" \
            --notes "Build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}. Install TurboButton.apk on your phone; copy TurboButton.exe (Windows) and TurboButton-x86_64.AppImage (Linux) to a USB stick."
